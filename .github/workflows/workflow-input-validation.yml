name: Workflow repository input validation
on:
  pull_request:
    paths:
      - 'scripts/resolve-workflow-repository.py'
      - 'scripts/propose-product-registration.py'
      - 'config/workflow-repositories.json'
      - 'config/governance-alignment.json'
      - 'tests/test_workflow_repository_inputs.py'
      - 'tests/test_product_registration.py'
      - 'registry/product-catalog.json'
      - '.github/workflows/*.yml'
permissions:
  contents: read
jobs:
  repository-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_workflow_repository_inputs.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_product_registration.py' -v
