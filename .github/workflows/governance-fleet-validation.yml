name: Governance fleet validation
on:
  pull_request:
    paths:
      - 'scripts/audit-governance-fleet.py'
      - 'tests/test_governance_fleet.py'
      - 'config/governance-fleet.json'
      - '.github/workflows/governance-fleet-audit.yml'
      - '.github/workflows/governance-fleet-validation.yml'
permissions:
  contents: read
jobs:
  fleet-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_governance_fleet.py' -v
