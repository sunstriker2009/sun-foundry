name: Repository Factory
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      approved_registration_pr:
        description: 'Merged Foundry product registration PR number'
        required: true
        type: string
      confirm_repository:
        description: 'Exact short repository slug from the approved registration'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('sun-factory-relay-{0}', github.run_id) || format('sun-factory-registration-{0}', inputs.approved_registration_pr) }}
  cancel-in-progress: false
jobs:
  relay-approved-registration:
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.repository == 'sunstriker2009/sun-foundry' &&
        github.actor == 'sunstriker2009' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'chore/propose-product-')
      }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    timeout-minutes: 5
    steps:
      - name: Dispatch the protected factory on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[1-9][0-9]*$ ]]
          [[ "$HEAD_REF" =~ ^chore/propose-product-SUN-[PC][0-9]{3}-(sun-[a-z0-9]+(-[a-z0-9]+)*)$ ]]
          target=${BASH_REMATCH[1]}
          jq -n --arg pr "$PR" --arg target "$target" \
            '{ref:"main",inputs:{approved_registration_pr:$pr,confirm_repository:$target}}' |
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/repository-factory-v1.yml/dispatches" --input -
          printf 'Dispatched the Repository Factory on main for registration PR #%s.\n' "$PR" >> "$GITHUB_STEP_SUMMARY"

  authorize-approved-registration:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.repository == 'sunstriker2009/sun-foundry' &&
        github.ref == 'refs/heads/main' &&
        inputs.approved_registration_pr != '' &&
        (github.actor == 'sunstriker2009' || github.actor == 'github-actions[bot]')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 5
    outputs:
      factory_target: ${{ steps.approval.outputs.factory_target }}
      manifest: ${{ steps.approval.outputs.manifest }}
      product: ${{ steps.approval.outputs.product }}
      approved_on: ${{ steps.approval.outputs.approved_on }}
      repository_visibility: ${{ steps.approval.outputs.repository_visibility }}
      publish_private_symbol: ${{ steps.approval.outputs.publish_private_symbol }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the owner-approved registration
        id: approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_PR: ${{ inputs.approved_registration_pr }}
          CONFIRM_SHORT: ${{ inputs.confirm_repository }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_PR" =~ ^[1-9][0-9]*$ ]]
          pull=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$APPROVED_PR")
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .merged == true and .merged_by.login == "sunstriker2009" and
            .base.ref == "main" and .base.repo.full_name == $repo and .head.repo.full_name == $repo
          ' <<< "$pull" >/dev/null
          sha=$(jq -r .merge_commit_sha <<< "$pull")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          APPROVED_HEAD_REF=$(jq -r .head.ref <<< "$pull")
          export APPROVED_HEAD_REF
          git fetch --no-tags --depth=2 origin "$sha"
          snapshot=$(mktemp -d)
          trap 'rm -rf "$snapshot"' EXIT
          git show "$sha^1:registry/product-catalog.json" > "$snapshot/base.json"
          git show "$sha:registry/product-catalog.json" > "$snapshot/approved.json"
          python3 scripts/propose-product-registration.py --resolve-approved "$snapshot/base.json" \
            --approved-catalog "$snapshot/approved.json"
          echo "approved_on=$(git show -s --format=%as "$sha")" >> "$GITHUB_OUTPUT"

  factory:
    needs: authorize-approved-registration
    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'workflow_dispatch' &&
        github.repository == 'sunstriker2009/sun-foundry' &&
        github.ref == 'refs/heads/main' &&
        needs.authorize-approved-registration.result == 'success'
      }}
    runs-on: ubuntu-latest
    environment: repository-administration
    timeout-minutes: 25
    env:
      APPROVED_VISIBILITY: ${{ needs.authorize-approved-registration.outputs.repository_visibility }}
      APPROVED_SYMBOL_COPY: ${{ needs.authorize-approved-registration.outputs.publish_private_symbol }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Create or locate repository and seed PR
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SUN_REPO_ADMIN_TOKEN }}
          TARGET: ${{ needs.authorize-approved-registration.outputs.factory_target }}
          APPROVED_MANIFEST: ${{ needs.authorize-approved-registration.outputs.manifest }}
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo "::error::Missing administration token"; exit 1; }
          [[ -n "$APPROVED_MANIFEST" && "$TARGET" =~ ^sun-[a-z0-9]+(-[a-z0-9]+)*$ ]] || {
            echo "::error::Missing verified registration identity"; exit 1
          }
          REPO="sunstriker2009/$TARGET"
          case "$APPROVED_VISIBILITY" in
            public) private=false ;;
            private) private=true ;;
            *) echo '::error::Missing verified repository visibility'; exit 1 ;;
          esac
          if visibility=$(gh api "repos/$REPO" --jq .visibility 2>/dev/null); then
            [[ "$visibility" == "$APPROVED_VISIBILITY" ]] || {
              echo '::error::Existing repository visibility differs from the approved registration'; exit 1
            }
            if bash scripts/verify-approved-product-seed.sh "$REPO" main; then
              echo "repository=$REPO" >> "$GITHUB_OUTPUT"
              echo "complete=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! bash scripts/verify-approved-product-seed.sh "$REPO" chore/sun-governance-ci-seed; then
              echo "::error::Existing repository has no matching approved seed; inspect it before retrying"; exit 1
            fi
          else
            gh api -X POST repos/sunstriker2009/sun-strata/generate \
              -f owner=sunstriker2009 -f name="$TARGET" -F private="$private" -F include_all_branches=false >/dev/null
          fi
          echo "repository=$REPO" >> "$GITHUB_OUTPUT"
          # Template generation is asynchronous: the repository may exist before
          # its default branch and Contents API are fully available.
          ready=false
          for attempt in {1..24}; do
            default=$(gh api "repos/$REPO" --jq .default_branch 2>/dev/null || true)
            if [[ "$default" == main ]] &&
               gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha >/dev/null 2>&1 &&
               gh api "repos/$REPO/contents/.github/workflows/ci.yml" --jq .path >/dev/null 2>&1 &&
               gh api "repos/$REPO/contents/.github/workflows/pr-title.yml" --jq .path >/dev/null 2>&1; then
              ready=true
              break
            fi
            echo "Waiting for template initialization ($attempt/24)..."
            sleep 5
          done
          [[ "$ready" == true ]] || { echo "::error::Repository template not ready after 120 seconds; resume after checking its main branch and workflows"; exit 1; }
          visibility=$(gh api "repos/$REPO" --jq .visibility)
          [[ "$visibility" == "$APPROVED_VISIBILITY" ]] || {
            echo '::error::Repository visibility differs from the approved registration'; exit 1
          }
          branch=chore/sun-governance-ci-seed
          pr=$(gh api "repos/$REPO/pulls?state=open&head=sunstriker2009:$branch" --jq '.[0].number // empty')
          if [[ -n "$pr" ]]; then
            # Resume only a genuine, open seed PR targeting main from the
            # expected branch. Do not silently accept an unrelated PR.
            valid=$(gh api "repos/$REPO/pulls/$pr" --jq '[.state, .base.ref, .head.ref, .head.repo.full_name] | join("|")')
            [[ "$valid" == "open|main|$branch|$REPO" ]] || {
              echo "::error::Existing PR #$pr does not match expected seed PR; inspect manually"
              exit 1
            }
            bash scripts/prepare-product-branding.sh "$REPO" "$branch"
          else
            if ! gh api "repos/$REPO/branches/$branch" >/dev/null 2>&1; then
              sha=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
              gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$sha" >/dev/null
            fi
            bash scripts/prepare-product-branding.sh "$REPO" "$branch"
            if ! gh api "repos/$REPO/contents/docs/SUN-GOVERNANCE-CI-SEED.md?ref=$branch" >/dev/null 2>&1; then
              content=$(printf '%s\n' '# SUN Governance CI Seed' '' 'Temporary validation PR. Squash merge only after governance Apply and Verify.' | base64 -w0)
              gh api -X PUT "repos/$REPO/contents/docs/SUN-GOVERNANCE-CI-SEED.md" \
                -f message="chore: seed SUN governance CI checks" -f content="$content" -f branch="$branch" >/dev/null
            fi
            pr=$(gh api -X POST "repos/$REPO/pulls" -f title="test: seed SUN governance CI checks" \
              -f head="$branch" -f base=main -f body="Disposable CI initialization PR; merge only after strict Verify." --jq .number)
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "Seed PR: https://github.com/$REPO/pull/$pr" >> "$GITHUB_STEP_SUMMARY"
      - name: Wait for required PR checks
        if: steps.prepare.outputs.complete != 'true'
        id: seed_checks
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SUN_REPO_ADMIN_TOKEN }}
          REPO: ${{ steps.prepare.outputs.repository }}
          PR: ${{ steps.prepare.outputs.pr }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          for attempt in {1..40}; do
            checks=$(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "repository-validation" or .name == "conventional-title") | {name,status,conclusion}]')
            echo "Attempt $attempt: $checks"
            if jq -e 'length == 2 and (map(.name) | unique | length) == 2 and all(.[]; .status == "completed" and .conclusion == "success")' <<< "$checks" >/dev/null; then
              echo "head_sha=$sha" >> "$GITHUB_OUTPUT"
              echo "Both required checks passed"; exit 0
            fi
            if jq -e 'any(.[]; .status == "completed" and (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out"))' <<< "$checks" >/dev/null; then
              echo "::error::A required check failed; fix the PR then dispatch Factory again with the same approved registration"; exit 1
            fi
            sleep 15
          done
          echo "::error::Timed out waiting for CI; retry with the same approved registration"; exit 1
      - name: Plan governance
        if: steps.prepare.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ secrets.SUN_REPO_ADMIN_TOKEN }}
          REPO: ${{ steps.prepare.outputs.repository }}
        run: dotnet run --project src/Sun.RepoBootstrap -- --repo "$REPO" --mode plan --checks repository-validation,conventional-title
      - name: Apply governance
        if: steps.prepare.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ secrets.SUN_REPO_ADMIN_TOKEN }}
          REPO: ${{ steps.prepare.outputs.repository }}
        run: dotnet run --project src/Sun.RepoBootstrap -- --repo "$REPO" --mode apply --checks repository-validation,conventional-title --confirm "$REPO"
      - name: Strict verify governance
        env:
          GH_TOKEN: ${{ secrets.SUN_REPO_ADMIN_TOKEN }}
          REPO: ${{ steps.prepare.outputs.repository }}
        run: dotnet run --project src/Sun.RepoBootstrap -- --repo "$REPO" --mode verify --checks repository-validation,conventional-title
      - name: Squash merge the verified product seed
        if: steps.prepare.outputs.complete != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SUN_REPO_ADMIN_TOKEN }}
          REPO: ${{ steps.prepare.outputs.repository }}
          PR: ${{ steps.prepare.outputs.pr }}
          VERIFIED_HEAD: ${{ steps.seed_checks.outputs.head_sha }}
          APPROVED_MANIFEST: ${{ needs.authorize-approved-registration.outputs.manifest }}
        run: |
          set -euo pipefail
          [[ "$VERIFIED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          bash scripts/verify-approved-product-seed.sh "$REPO" "$VERIFIED_HEAD"
          merged=$(gh api -X PUT "repos/$REPO/pulls/$PR/merge" -f sha="$VERIFIED_HEAD" -f merge_method=squash)
          jq -e '.merged == true' <<< "$merged" >/dev/null
      - name: Approved product completion summary
        env:
          REPO: ${{ steps.prepare.outputs.repository }}
        run: |
          printf 'Verified repository `%s` (`%s`) and seeded its product identity.\n\nPublic gallery copy of private symbol approved: `%s`\n' \
            "$REPO" "$APPROVED_VISIBILITY" "$APPROVED_SYMBOL_COPY" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify main and publish the approved identity to Foundry
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SUN_REPO_ADMIN_TOKEN }}
          REPO: ${{ steps.prepare.outputs.repository }}
          APPROVED_MANIFEST: ${{ needs.authorize-approved-registration.outputs.manifest }}
          APPROVED_PRODUCT: ${{ needs.authorize-approved-registration.outputs.product }}
          APPROVED_ON: ${{ needs.authorize-approved-registration.outputs.approved_on }}
          SYMBOL_RELAY_APP_ID: ${{ secrets.SUN_SYMBOL_RELAY_APP_ID }}
          SYMBOL_RELAY_APP_PRIVATE_KEY: ${{ secrets.SUN_SYMBOL_RELAY_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          product_main=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          [[ "$product_main" =~ ^[0-9a-f]{40}$ ]]
          bash scripts/verify-approved-product-seed.sh "$REPO" "$product_main"
          visibility=$(gh api "repos/$REPO" --jq .visibility)
          [[ "$visibility" == "$APPROVED_VISIBILITY" ]] || {
            echo '::error::Repository visibility differs from the approved registration'; exit 1
          }
          if [[ "$APPROVED_VISIBILITY" != public && "$APPROVED_SYMBOL_COPY" != true ]]; then
            echo 'This registration does not require a gallery symbol relay.'
          elif [[ -z "$SYMBOL_RELAY_APP_ID" && -z "$SYMBOL_RELAY_APP_PRIVATE_KEY" ]]; then
            echo '::warning::Symbol relay credentials are absent. Daily reconciliation remains available.'
          elif [[ -z "$SYMBOL_RELAY_APP_ID" || -z "$SYMBOL_RELAY_APP_PRIVATE_KEY" ]]; then
            echo '::error::Configure both symbol relay App credentials in repository-administration.'
            exit 1
          else
            relay_type=$(gh api "repos/$REPO/contents/.github/workflows/gallery-symbol-relay.yml?ref=$product_main" --jq .type)
            [[ "$relay_type" == file ]]
            printf '%s' "$SYMBOL_RELAY_APP_ID" | gh secret set SUN_SYMBOL_RELAY_APP_ID --repo "$REPO"
            printf '%s' "$SYMBOL_RELAY_APP_PRIVATE_KEY" | gh secret set SUN_SYMBOL_RELAY_APP_PRIVATE_KEY --repo "$REPO"
          fi
          python3 scripts/publish-product-registration.py
