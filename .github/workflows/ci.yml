name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate product registration against the PR base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base_catalog=$(mktemp)
          trap 'rm -f "$base_catalog"' EXIT
          git show HEAD^1:registry/product-catalog.json > "$base_catalog"
          python3 scripts/propose-product-registration.py --validate-pr "$base_catalog"
      - name: Validate the Foundry registry and gallery
        run: python3 scripts/render-repository-gallery.py --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image-test dependency
        run: python3 -m pip install -r assets/requirements.txt
      - name: Run shared Python validation suite
        run: python3 scripts/run-validation-tests.py
      - name: Validate shell syntax
        run: |
          bash -n scripts/register-foundry-repository.sh
          bash -n scripts/prepare-product-branding.sh
          bash -n scripts/verify-approved-product-seed.sh
          bash -n scripts/merge-owner-approved-registration.sh
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/Sun.RepoBootstrap/Sun.RepoBootstrap.csproj --configuration Release
