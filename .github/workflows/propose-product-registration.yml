name: "Registration: New repository"
on:
  workflow_dispatch:
    inputs:
      product_name:
        description: 'Base product name, e.g. CodeFolio'
        required: true
        type: string
      product_family:
        description: 'SUN product family'
        required: true
        type: choice
        default: productivity
        options:
          - productivity
          - application_component
      short_description:
        description: 'Optional single-line product description'
        required: false
        type: string
      repository_visibility:
        description: 'GitHub repository visibility. Product registration metadata is public.'
        required: true
        default: public
        type: choice
        options: [public, private]
      publish_private_symbol:
        description: 'Approve a public gallery copy of this private repository’s canonical symbol'
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  propose:
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == 'sunstriker2009' && github.repository == 'sunstriker2009/sun-foundry' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: repository-administration
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.SUN_REPO_ADMIN_TOKEN }}
      - name: Validate and prepare the registration
        id: proposal
        env:
          GH_TOKEN: ${{ secrets.SUN_REPO_ADMIN_TOKEN }}
          PRODUCT_NAME: ${{ inputs.product_name }}
          PRODUCT_FAMILY: ${{ inputs.product_family }}
          SHORT_DESCRIPTION: ${{ inputs.short_description }}
          REPOSITORY_VISIBILITY: ${{ inputs.repository_visibility }}
          PUBLISH_PRIVATE_SYMBOL: ${{ inputs.publish_private_symbol }}
        run: python3 scripts/propose-product-registration.py
      - name: Open the Foundry registry PR
        id: proposal_pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SUN_REPO_ADMIN_TOKEN }}
          REPOSITORY: ${{ steps.proposal.outputs.repository }}
          FAMILY_ID: ${{ steps.proposal.outputs.family_id }}
          REPOSITORY_VISIBILITY: ${{ steps.proposal.outputs.repository_visibility }}
          PUBLISH_PRIVATE_SYMBOL: ${{ steps.proposal.outputs.publish_private_symbol }}
        run: |
          set -euo pipefail
          branch="chore/propose-product-$FAMILY_ID-$REPOSITORY"
          ref="refs/heads/$branch"
          base=$(git rev-parse HEAD)
          git add registry/product-catalog.json
          git -c user.name='sun-foundry[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "chore(registry): propose $REPOSITORY"

          existing=$(git ls-remote --heads origin "$ref")
          if [[ -z "$existing" ]]; then
            git push --force-with-lease="$ref:" origin "HEAD:$ref"
            head=$(git rev-parse HEAD)
          else
            git fetch --depth=2 origin "$ref"
            if [[ "$(git show -s --format=%P FETCH_HEAD)" != "$base" ]] || ! git diff --quiet HEAD FETCH_HEAD; then
              echo "::error::Existing proposal branch $branch differs from this proposal. Review the existing branch and PR."
              exit 1
            fi
            head=$(git rev-parse FETCH_HEAD)
          fi

          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --state open --json url --jq '.[0].url // empty')
          if [[ -z "$pr" ]]; then
            body=$(printf '%s\n' \
              "Proposed family ID: \`$FAMILY_ID\`" \
              "Proposed repository: \`sunstriker2009/$REPOSITORY\`" \
              "Repository visibility: \`$REPOSITORY_VISIBILITY\`" \
              "Public gallery copy of private symbol approved: \`$PUBLISH_PRIVATE_SYMBOL\`" \
              "" \
              "The owner approved this registration by dispatching the workflow. Foundry will squash-merge the exact proposal after the required check passes.")
            pr=$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" --base main \
              --title "chore(registry): propose $REPOSITORY" --body "$body")
          fi
          printf 'Repository: `sunstriker2009/%s` (`%s`)\n\nFamily ID: `%s`\n\nPublic gallery copy of private symbol approved: `%s`\n\n[Registration PR](%s)\n' \
            "$REPOSITORY" "$REPOSITORY_VISIBILITY" "$FAMILY_ID" "$PUBLISH_PRIVATE_SYMBOL" "$pr" >> "$GITHUB_STEP_SUMMARY"
          [[ "$pr" =~ ^https://github\.com/sunstriker2009/sun-foundry/pull/([1-9][0-9]*)$ ]]
          printf 'number=%s\nhead=%s\nbranch=%s\n' "${BASH_REMATCH[1]}" "$head" "$branch" >> "$GITHUB_OUTPUT"
      - name: Squash-merge the owner-approved registration
        if: github.triggering_actor == 'sunstriker2009'
        env:
          GH_TOKEN: ${{ secrets.SUN_REPO_ADMIN_TOKEN }}
          REGISTRATION_PR: ${{ steps.proposal_pr.outputs.number }}
          REGISTRATION_HEAD: ${{ steps.proposal_pr.outputs.head }}
          REGISTRATION_BRANCH: ${{ steps.proposal_pr.outputs.branch }}
        run: bash scripts/merge-owner-approved-registration.sh
