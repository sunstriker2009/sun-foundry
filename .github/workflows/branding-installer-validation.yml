name: Branding installer validation
on:
  pull_request:
    paths:
      - 'scripts/install-branding.py'
      - 'scripts/install-branding-branch.py'
      - 'actions/install-branding-zip/**'
      - 'tests/test_branding_branch.py'
      - 'scripts/propose-branding-install.py'
      - 'scripts/resolve-workflow-repository.py'
      - 'config/workflow-repositories.json'
      - 'tests/test_branding_installer.py'
      - 'assets/requirements.txt'
      - '.github/workflows/branding-zip-install.yml'
      - '.github/workflows/branding-installer-validation.yml'
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r assets/requirements.txt
      - run: python3 -m unittest discover -s tests -p 'test_branding*.py' -v
