name: Register SUN Repository
on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Repository (owner is implicit)'
        required: true
        type: choice
        options:
          - sun-foundry
          - sun-strata
          - sun-ecosystem
          - sun-oryva
          - sun-astelvo
          - other-repository
      repository_name:
        description: 'Only for other-repository: short name, e.g. sun-example'
        required: false
        type: string
      confirm_repository:
        description: 'Repeat short repository name'
        required: true
        type: string
      mode:
        description: 'Preview (read only) or create pending registration PR'
        required: true
        type: choice
        options: [preview, apply]
        default: preview
permissions:
  contents: read
concurrency:
  group: sun-ecosystem-registration
  cancel-in-progress: false
jobs:
  register:
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == 'sunstriker2009' && github.repository == 'sunstriker2009/sun-foundry' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: repository-administration
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Resolve repository selection
        id: target
        env:
          SELECTION: ${{ inputs.repository }}
          OTHER_REPOSITORY: ${{ inputs.repository_name }}
          CONFIRM_SHORT: ${{ inputs.confirm_repository }}
          OPERATION: ${{ inputs.mode }}
        run: python3 scripts/resolve-workflow-repository.py --profile registration
      - name: Validate and propose registration
        env:
          GH_TOKEN: ${{ secrets.SUN_REPO_ADMIN_TOKEN }}
          TARGET: ${{ steps.target.outputs.repository }}
          CONFIRM: ${{ steps.target.outputs.confirmation }}
          MODE: ${{ inputs.mode }}
        run: bash scripts/register-ecosystem-repository.sh
