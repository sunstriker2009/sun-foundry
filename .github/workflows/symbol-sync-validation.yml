name: Symbol sync validation
on:
  pull_request:
    paths:
      - 'scripts/sync-approved-symbol.py'
      - 'scripts/reconcile-approved-symbols.py'
      - '.github/workflows/reconcile-approved-symbols.yml'
      - '.github/workflows/notify-gallery-symbol.yml'
      - '.github/workflows/sync-approved-sun-symbol.yml'
      - '.github/workflows/symbol-sync-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile scripts/sync-approved-symbol.py scripts/reconcile-approved-symbols.py
      - name: Validate safety invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script=Path('scripts/sync-approved-symbol.py').read_text()
          workflow=Path('.github/workflows/sync-approved-sun-symbol.yml').read_text()
          for token in ('"preview"', '"apply"', 'args.confirm', 'sha256(data)', 'render-repository-gallery.py', 'Existing symbol-sync branch', 'classification"] == "pending"'):
              assert token in script, token
          assert '"--auto", "--squash"' in script
          assert 'set(changed) <= expected' in script
          assert 'args.source == "branding/assets/symbol.png"' in script
          assert 'symbol-approvals.json' not in script
          assert 'github.actor == ' in workflow
          reconcile=Path('scripts/reconcile-approved-symbols.py').read_text()
          assert 'iconSha256' in reconcile
          assert 'symbol-approvals.json' not in reconcile
          scheduled=Path('.github/workflows/reconcile-approved-symbols.yml').read_text()
          assert 'repository-symbol-sync' in scheduled
          assert 'SUN_SYMBOL_SYNC_TOKEN' in scheduled
          assert 'repository-administration' in workflow
          assert 'options: [preview, apply]' in workflow
          PY
      - name: Validate PNG reading behavior
        run: |
          python3 - <<'PY'
          import base64, importlib.util, json
          from unittest.mock import patch
          for path in ('scripts/sync-approved-symbol.py', 'scripts/reconcile-approved-symbols.py'):
              spec = importlib.util.spec_from_file_location('subject', path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              data = bytes.fromhex('89504e470d0a1a0a') + b'x' * 1_100_000
              encoded = base64.b64encode(data).decode()
              meta = dict(type='file', size=len(data), encoding='none', sha='blob-id')
              with patch.object(module.subprocess, 'check_output', return_value=json.dumps(dict(encoding='base64', content=encoded))) as api:
                  assert module.read_png_blob('owner/repo', 'symbol.png', meta) == data
                  assert api.call_args.args[0] == ['gh', 'api', 'repos/owner/repo/git/blobs/blob-id']
              for bad in (dict(meta, size=2_000_001), dict(meta, size=0),
                          dict(meta, encoding='base64', content=base64.b64encode(b'bad').decode(), size=3)):
                  try:
                      module.read_png_blob('owner/repo', 'symbol.png', bad)
                  except SystemExit:
                      pass
                  else:
                      raise AssertionError('Invalid PNG accepted')
          PY
      - name: Validate targeted reconciliation
        run: |
          python3 - <<'PY'
          import base64, importlib.util, json, sys
          from subprocess import CompletedProcess
          from unittest.mock import patch

          spec = importlib.util.spec_from_file_location('subject', 'scripts/reconcile-approved-symbols.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          target = 'sunstriker2009/sun-codefolio'
          other = 'sunstriker2009/sun-workbench'
          pending = 'sunstriker2009/sun-pending'
          catalog = {'schemaVersion': 1, 'galleryDirectory': 'gallery', 'repositories': [
              {'repository': target, 'classification': 'product'},
              {'repository': other, 'classification': 'product'},
              {'repository': pending, 'classification': 'pending'},
          ]}
          png = bytes.fromhex('89504e470d0a1a0a')
          meta = json.dumps({'type': 'file', 'size': len(png), 'encoding': 'base64',
                             'content': base64.b64encode(png).decode()})
          result = CompletedProcess([], 0, stdout=meta)
          with patch.object(module, 'api', return_value=json.dumps(catalog)), \
               patch.object(module.subprocess, 'run', return_value=result) as run:
              for selection, expected in ((target, [target]), ('', [target, other])):
                  run.reset_mock()
                  with patch.object(sys, 'argv', ['reconcile', f'--repository={selection}']):
                      module.main()
                  calls = [call.args[0] for call in run.call_args_list]
                  assert [args[2] for args in calls[::2]] == [
                      f'repos/{repo}/contents/{module.SOURCE}?ref=main' for repo in expected]
                  assert [args[3] for args in calls[1::2]] == expected
              for selection in (pending, 'other/unknown'):
                  run.reset_mock()
                  with patch.object(sys, 'argv', ['reconcile', f'--repository={selection}']):
                      try:
                          module.main()
                      except SystemExit as exc:
                          assert str(exc) == 'Target must be a confirmed Foundry repository'
                      else:
                          raise AssertionError('Unconfirmed dispatch target was accepted')
                  run.assert_not_called()
          PY
