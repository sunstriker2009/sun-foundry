name: Symbol sync validation
on:
  pull_request:
    paths:
      - 'scripts/sync-approved-symbol.py'
      - 'scripts/propose-symbol-approval.py'
      - '.github/workflows/propose-symbol-approval.yml'
      - 'scripts/reconcile-approved-symbols.py'
      - '.github/workflows/reconcile-approved-symbols.yml'
      - '.github/workflows/sync-approved-sun-symbol.yml'
      - '.github/workflows/symbol-sync-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile scripts/sync-approved-symbol.py scripts/reconcile-approved-symbols.py scripts/propose-symbol-approval.py
      - name: Validate safety invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script=Path('scripts/sync-approved-symbol.py').read_text()
          workflow=Path('.github/workflows/sync-approved-sun-symbol.yml').read_text()
          for token in ('"preview"', '"apply"', 'args.confirm', 'meta.get("size", 0) > 2_000_000', 'sha256(data)', 'render-repository-gallery.py', 'Existing symbol-sync branch', 'classification"] == "pending"'):
              assert token in script, token
          assert '"--auto", "--squash"' in script
          assert 'set(changed) != expected' in script
          assert 'args.source == "branding/assets/symbol.png"' in script
          assert 'symbol-approvals.json' in script
          assert 'github.actor == ' in workflow
          reconcile=Path('scripts/reconcile-approved-symbols.py').read_text()
          assert 'actual != expected' in reconcile
          assert 'symbol-approvals.json' in reconcile
          scheduled=Path('.github/workflows/reconcile-approved-symbols.yml').read_text()
          assert 'repository-symbol-sync' in scheduled
          assert 'SUN_SYMBOL_SYNC_TOKEN' in scheduled
          proposal=Path('scripts/propose-symbol-approval.py').read_text()
          approval_workflow=Path('.github/workflows/propose-symbol-approval.yml').read_text()
          assert 'registry/symbol-approvals.json' in proposal
          assert 'changed != ["registry/symbol-approvals.json"]' in proposal
          assert '"--auto"' not in proposal
          assert 'github.actor == ' in approval_workflow
          assert 'repository-administration' in approval_workflow
          assert 'repository-administration' in workflow
          assert 'options: [preview, apply]' in workflow
          PY
