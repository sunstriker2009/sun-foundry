name: "Gallery: Validate symbol sync"
on:
  pull_request:
    paths:
      - 'scripts/sync-approved-symbol.py'
      - 'scripts/reconcile-approved-symbols.py'
      - 'scripts/render-repository-gallery.py'
      - 'tests/test_gallery_symbol_modes.py'
      - '.github/workflows/reconcile-approved-symbols.yml'
      - '.github/workflows/notify-gallery-symbol.yml'
      - '.github/workflows/sync-approved-sun-symbol.yml'
      - '.github/workflows/symbol-sync-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate gallery modes and copy authorization
        run: python3 -m unittest discover -s tests -p test_gallery_symbol_modes.py -v
