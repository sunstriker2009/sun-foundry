name: SUN Rename Repository
on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Current short repository name (must be configured)'
        type: string
        required: true
      new_name:
        description: 'New short repository name; does not change product identity'
        type: string
        required: true
      operation:
        description: 'Execute plans and applies automatically; Plan is read-only'
        type: choice
        options: [execute, plan]
        default: execute
        required: true
permissions:
  contents: read
concurrency:
  group: sun-repository-rename
  cancel-in-progress: false
jobs:
  rename:
    if: ${{ github.repository == 'sunstriker2009/sun-foundry' && github.ref == 'refs/heads/main' && github.actor == 'sunstriker2009' }}
    environment: repository-administration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate plan and automatically apply when selected
        env:
          GH_TOKEN: ${{ secrets.SUN_REPO_ADMIN_TOKEN }}
          OPERATION: ${{ inputs.operation }}
          SOURCE: ${{ inputs.repository }}
          DESTINATION: ${{ inputs.new_name }}
        run: |
          python3 scripts/rename-repository.py --operation "$OPERATION" --repository "$SOURCE" --new-name "$DESTINATION"
      - name: Publish plan and outcome
        if: always()
        run: |
          if [[ -f artifacts/repository-rename/summary.md ]]; then
            cat artifacts/repository-rename/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f artifacts/repository-rename/result.json ]]; then
            cat artifacts/repository-rename/result.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repository-rename-run
          path: artifacts/repository-rename/
          retention-days: 7
          if-no-files-found: warn

