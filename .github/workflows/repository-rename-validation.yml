name: Repository rename validation
on:
  pull_request:
    paths:
      - 'scripts/rename-repository.py'
      - 'tests/test_repository_rename.py'
      - '.github/workflows/rename-repository.yml'
      - '.github/workflows/repository-rename-validation.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/rename-repository.py'
      - 'tests/test_repository_rename.py'
      - '.github/workflows/rename-repository.yml'
      - '.github/workflows/repository-rename-validation.yml'
permissions:
  contents: read
jobs:
  rename-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p test_repository_rename.py -v
