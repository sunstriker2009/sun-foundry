name: SUN Governance Alignment
on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Repository (owner is implicit)'
        required: true
        type: choice
        default: sun-foundry
        options:
          - sun-foundry
          - sun-strata
          - sun-oryva
          - sun-workbench
          - sun-ecosystem
      operation:
        description: 'Plan changes, apply a reviewed plan, or verify'
        type: choice
        required: true
        default: plan
        options: [plan, apply, verify]
      plan_run_id:
        description: 'Leave empty for Plan/Verify; Apply needs the reviewed Plan run ID'
        type: string
        required: false
        default: ''
      confirm_repository:
        description: 'Leave empty for Plan/Verify; Apply needs the short repository name'
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: sun-governance-alignment
  cancel-in-progress: false
jobs:
  align:
    if: ${{ github.repository == 'sunstriker2009/sun-foundry' && github.ref == 'refs/heads/main' && github.actor == 'sunstriker2009' }}
    runs-on: ubuntu-latest
    environment: repository-administration
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve repository selection
        id: target
        env:
          SELECTION: ${{ inputs.repository }}
          CONFIRM_SHORT: ${{ inputs.confirm_repository }}
          OPERATION: ${{ inputs.operation }}
        run: python3 scripts/resolve-workflow-repository.py --profile alignment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Apply inputs
        id: apply_inputs
        if: ${{ inputs.operation == 'apply' }}
        env:
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          TARGET: ${{ steps.target.outputs.repository }}
          CONFIRM: ${{ steps.target.outputs.confirmation }}
        run: |
          python3 - <<'PY'
          import os
          value = os.environ['PLAN_RUN_ID'].strip()
          if not value.isascii() or not value.isdigit() or int(value) <= 0:
              raise SystemExit('Apply requires a positive Plan run ID')
          if os.environ['TARGET'] != os.environ['CONFIRM']:
              raise SystemExit('Apply requires exact repository confirmation')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'plan_run_id={int(value)}\n')
          PY
      - uses: actions/download-artifact@v4
        if: ${{ inputs.operation == 'apply' }}
        with:
          name: governance-alignment-plan
          path: reviewed-plan
          run-id: ${{ steps.apply_inputs.outputs.plan_run_id }}
          github-token: ${{ github.token }}
      - name: Validate reviewed Plan result
        if: ${{ inputs.operation == 'apply' }}
        env:
          TARGET: ${{ steps.target.outputs.repository }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path('reviewed-plan/result.json').read_text())
          if result.get('operation') != 'plan' or result.get('status') != 'planned' or result.get('repository') != os.environ['TARGET']:
              raise SystemExit('Artifact must be a successful Plan for this target')
          PY
      - name: Plan, apply or verify selected ruleset
        env:
          GH_TOKEN: ${{ secrets.SUN_REPO_ADMIN_TOKEN }}
          TARGET: ${{ steps.target.outputs.repository }}
          OPERATION: ${{ inputs.operation }}
          CONFIRM: ${{ steps.target.outputs.confirmation }}
        run: |
          args=(--repository "$TARGET" --operation "$OPERATION")
          if [[ "$OPERATION" == apply ]]; then
            args+=(--reviewed-plan reviewed-plan/plan.json --confirm "$CONFIRM")
          fi
          python3 scripts/align-governance.py "${args[@]}"
      - name: Publish plan and outcome
        if: ${{ always() }}
        run: |
          if [ -f artifacts/governance-alignment/summary.md ]; then
            cat artifacts/governance-alignment/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/governance-alignment/result.json ]; then
            cat artifacts/governance-alignment/result.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: governance-alignment-plan
          path: artifacts/governance-alignment/
          retention-days: 7
          if-no-files-found: warn
