name: Reconcile Approved SUN Symbols
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      repository:
        description: 'Confirmed owner/repository to reconcile. Leave blank to reconcile all.'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: sun-ecosystem-symbol-sync
  cancel-in-progress: false
jobs:
  reconcile:
    if: ${{ github.repository == 'sunstriker2009/sun-foundry' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: repository-symbol-sync
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Sync canonical branding merged to main
        env:
          GH_TOKEN: ${{ secrets.SUN_SYMBOL_SYNC_TOKEN }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
        run: python3 scripts/reconcile-approved-symbols.py --repository="$TARGET_REPOSITORY"
      - name: Activate first live symbols for public products
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.SUN_SYMBOL_SYNC_TOKEN }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
        run: python3 scripts/publish-product-registration.py --activate-public-symbols --repository="$TARGET_REPOSITORY"
