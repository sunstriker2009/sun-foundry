name: SUN Repository Factory
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'New repository name (sun- prefix recommended)'
        required: true
        type: string
      visibility:
        description: 'Visibility'
        required: true
        type: choice
        options: [private, public]
        default: private
      confirm_name:
        description: 'Repeat repository name to authorize creation'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sun-factory-${{ inputs.name }}
  cancel-in-progress: false
jobs:
  create:
    runs-on: ubuntu-latest
    environment: repository-administration
    outputs:
      repository: ${{ steps.create.outputs.repository }}
    steps:
      - name: Create from SUN template
        id: create
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SUN_REPO_ADMIN_TOKEN }}
          NAME: ${{ inputs.name }}
          CONFIRM: ${{ inputs.confirm_name }}
          VISIBILITY: ${{ inputs.visibility }}
          OWNER: sunstriker2009
        run: |
          set -euo pipefail
          [[ "$NAME" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,99}$ ]] || { echo '::error::Invalid repository name'; exit 1; }
          [[ "$NAME" == "$CONFIRM" ]] || { echo '::error::Confirmation does not match'; exit 1; }
          [[ "$VISIBILITY" == private || "$VISIBILITY" == public ]] || exit 1
          command -v gh >/dev/null
          if gh api "repos/$OWNER/$NAME" >/dev/null 2>&1; then
            echo "::error::Repository already exists: $OWNER/$NAME"
            exit 1
          fi
          if [[ "$VISIBILITY" == private ]]; then PRIVATE=true; else PRIVATE=false; fi
          gh api --method POST "repos/$OWNER/sun-repo-template/generate" \
            -f owner="$OWNER" -f name="$NAME" -F private="$PRIVATE" -F include_all_branches=false >/dev/null
          echo "repository=$OWNER/$NAME" >> "$GITHUB_OUTPUT"
          echo "Created $OWNER/$NAME from SUN template" >> "$GITHUB_STEP_SUMMARY"
  plan:
    needs: create
    runs-on: ubuntu-latest
    # Plan needs the same repository-scoped credential as Create.
    # Audit-only environment secrets cannot be assumed to contain it.
    environment: repository-administration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Plan governance
        env:
          GH_TOKEN: ${{ secrets.SUN_REPO_ADMIN_TOKEN }}
          REPO: ${{ needs.create.outputs.repository }}
        run: dotnet run --project src/Sun.RepoBootstrap -- --repo "$REPO" --mode plan --checks repository-validation,conventional-title
      - name: Next steps
        env:
          REPO: ${{ needs.create.outputs.repository }}
        run: |
          echo "Created $REPO. Next: run the template CI on main and a PR, then use the existing provisioning workflow for approved Apply and strict Verify." >> "$GITHUB_STEP_SUMMARY"
