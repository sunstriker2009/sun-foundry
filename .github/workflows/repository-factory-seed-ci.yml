name: SUN Repository Factory Seed CI
on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Existing SUN repository (owner/name)'
        required: true
        type: string
      confirm_repository:
        description: 'Repeat owner/name to authorize a seed PR'
        required: true
        type: string
permissions:
  contents: read
jobs:
  seed:
    runs-on: ubuntu-latest
    environment: repository-administration
    steps:
      - name: Validate and create seed pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SUN_REPO_ADMIN_TOKEN }}
          TARGET: ${{ inputs.repository }}
          CONFIRM: ${{ inputs.confirm_repository }}
        run: |
          set -euo pipefail
          [[ "$TARGET" =~ ^sunstriker2009/[A-Za-z0-9._-]+$ ]] || { echo "::error::Target must belong to sunstriker2009"; exit 1; }
          [[ "$TARGET" == "$CONFIRM" ]] || { echo "::error::Repository confirmation mismatch"; exit 1; }
          [[ -n "$GH_TOKEN" ]] || { echo "::error::Missing administration credential"; exit 1; }
          branch="chore/sun-governance-ci-seed"
          gh api "repos/$TARGET" --jq '.full_name' >/dev/null
          default=$(gh api "repos/$TARGET" --jq '.default_branch')
          [[ "$default" == main ]] || { echo "::error::Expected main default branch"; exit 1; }
          for path in .github/workflows/ci.yml .github/workflows/pr-title.yml; do
            gh api "repos/$TARGET/contents/$path" --jq '.path' >/dev/null || { echo "::error::Missing template workflow $path"; exit 1; }
          done
          existing=$(gh api "repos/$TARGET/pulls?state=open&head=sunstriker2009:$branch" --jq 'length')
          if [[ "$existing" != 0 ]]; then
            echo "::error::Seed PR already open; inspect it rather than creating another"
            exit 1
          fi
          if gh api "repos/$TARGET/branches/$branch" >/dev/null 2>&1; then
            echo "::error::Seed branch already exists; resolve manually"
            exit 1
          fi
          sha=$(gh api "repos/$TARGET/git/ref/heads/main" --jq '.object.sha')
          gh api --method POST "repos/$TARGET/git/refs" -f ref="refs/heads/$branch" -f sha="$sha" >/dev/null
          content=$(printf '%s\n' '# SUN Governance CI Seed' '' 'Temporary validation PR to establish the SUN repository-validation and conventional-title check contexts.' '' 'After governance Apply and Verify, squash merge this PR and confirm automatic source branch deletion.' | base64 -w0)
          gh api --method PUT "repos/$TARGET/contents/docs/SUN-GOVERNANCE-CI-SEED.md" \
            -f message="chore: seed SUN governance CI checks" -f content="$content" -f branch="$branch" >/dev/null
          url=$(gh api --method POST "repos/$TARGET/pulls" \
            -f title="test: seed SUN governance CI checks" \
            -f head="$branch" -f base=main \
            -f body="Disposable CI initialization PR. Do not merge until governance is applied and verified." --jq '.html_url')
          echo "Seed PR created: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Wait for both required check contexts, then use SUN Repository Factory Resume: Apply followed by Verify." >> "$GITHUB_STEP_SUMMARY"
