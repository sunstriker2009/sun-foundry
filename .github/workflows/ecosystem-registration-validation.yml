name: Foundry registration validation
on:
  pull_request:
    paths:
      - 'scripts/register-foundry-repository.sh'
      - 'scripts/publish-product-registration.py'
      - 'tests/test_product_publication.py'
      - '.github/workflows/register-sun-repository.yml'
      - '.github/workflows/repository-factory-v1.yml'
      - '.github/workflows/ecosystem-registration-validation.yml'
permissions:
  contents: read
jobs:
  registration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n scripts/register-foundry-repository.sh
      - name: Test approved product publication
        run: python3 -m unittest discover -s tests -p 'test_product_publication.py' -v
      - name: Verify fail-closed boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script=Path('scripts/register-foundry-repository.sh').read_text()
          factory=Path('.github/workflows/repository-factory-v1.yml').read_text()
          manual=Path('.github/workflows/register-sun-repository.yml').read_text()
          for required in ('"classification":"pending"', '"registryId":None', 'Repository confirmation mismatch', 'Existing registration branch', 'python3 scripts/render-repository-gallery.py'):
              assert required in script, required
          assert factory.index('Strict verify governance') < factory.index('Propose pending SUN repository registration')
          assert factory.index('Squash merge the verified product seed') < factory.index('Verify main and publish the approved identity to Foundry')
          assert 'options: [preview, apply]' in manual
          assert 'github.actor == ' in manual
          PY
